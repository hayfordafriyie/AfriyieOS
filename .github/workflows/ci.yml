name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# `main` is always green and always bootable — that is the rule that keeps the
# project trustworthy, and this workflow is how it is enforced.

env:
  # Pinned so a toolchain bump is a deliberate change, not a surprise break.
  BINUTILS_VERSION: "2.42"
  GCC_VERSION: "14.2.0"
  # The name every tool already uses. The workflow said AF_PREFIX, which no
  # script has ever read: build_toolchain.sh falls back to $HOME/opt/cross,
  # so the toolchain was built and installed into $HOME/opt/cross while the
  # cache saved and restored $GITHUB_WORKSPACE/opt/cross. The cache could
  # never hit — every run rebuilt binutils and gcc from source — and then
  # PATH pointed at a directory that was still empty, so the very next step
  # failed to find the compiler it had just spent forty minutes building.
  AF_CROSS_PREFIX: ${{ github.workspace }}/opt/cross

jobs:
  # ===========================================================================
  # T1 — host tests, compile check and link check
  #
  # Everything here runs with the stock gcc, nasm and binutils in about a
  # minute, with NO cross-compiler. That is deliberate: it is the fastest useful
  # feedback in the project, and it catches type errors, warnings, static assert
  # failures, assembly syntax errors, linker script problems and layout
  # mismatches — which is the overwhelming majority of build breakage.
  # ===========================================================================
  host-tests:
    name: Host tests, compile and link check (T1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm binutils file

      - name: Environment report
        run: bash tools/check_env.sh || true

      - name: Byte-compile the tooling
        run: python -m compileall -q tools tests

      - name: Tooling syntax against the CI interpreter
        run: python tools/pycompat.py

      - name: Native tests (user-space C libraries)
        run: bash tools/native_test.sh

      - name: Host test suite (image toolchain)
        run: python -m unittest discover -s tests/host -v

      - name: Compile check — every C and assembly file
        run: bash tools/compile_check.sh

      - name: Link check — linker script, symbols and layout
        run: bash tools/link_check.sh

      - name: Upload the link-check kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-kernel
          path: |
            build/linkcheck/kernel.elf
            build/linkcheck/kernel.map
          if-no-files-found: warn

  # ===========================================================================
  # Build and boot
  #
  # The real thing: the cross toolchain (cached), the kernel, the UEFI
  # application, the disk image, and a boot in QEMU that asserts the kernel's
  # markers.
  # ===========================================================================
  build-and-boot:
    name: Build and boot (T2/T3)
    runs-on: ubuntu-24.04
    needs: host-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev \
            texinfo nasm ninja-build cmake ovmf qemu-system-x86 file \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      # The toolchain cache is the difference between a 3-minute job and a
      # 40-minute one. The key includes the pinned versions so a bump rebuilds.
      - name: Cache the cross toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AF_CROSS_PREFIX }}
          # v2: v1 was saved from the wrong directory (see AF_CROSS_PREFIX above), so a
          # v1 hit would restore something that is not a toolchain and skip the
          # build. Bump this whenever the cache path or the layout changes —
          # changing the path alone leaves the stale entry to be restored.
          key: cross-${{ runner.os }}-binutils${{ env.BINUTILS_VERSION }}-gcc${{ env.GCC_VERSION }}-v2

      - name: Build the cross toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x tools/*.sh
          ./tools/build_toolchain.sh x86_64-elf

      - name: Verify the toolchains
        run: |
          export PATH="$AF_CROSS_PREFIX/bin:$PATH"
          x86_64-elf-gcc --version | head -1
          x86_64-w64-mingw32-gcc --version | head -1
          nasm -v
          cmake --version | head -1

      - name: Configure
        run: |
          export PATH="$AF_CROSS_PREFIX/bin:$PATH"
          cmake -B build/x86_64 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-x86_64-elf.cmake \
                -DAF_TARGET=x86_64 \
                -DCROSS_PREFIX="$AF_CROSS_PREFIX"

      - name: Build
        run: cmake --build build/x86_64 -v

      - name: Verify the boot bridge is a UEFI application
        run: |
          EFI=build/x86_64/boot/BOOTX64.EFI

          # Printed for the log, NOT asserted on. `file` describes a PE32+ EFI
          # application differently depending on its version:
          #
          #   dev machine : PE32+ executable for EFI (application), x86-64 ...
          #   CI runner   : PE32+ executable (EFI application) x86-64 ..., for MS Windows
          #
          # This step asserted on "EFI (application)", which matches the second
          # and not the first. It was written against one machine's `file` and
          # failed on the other's — the same class of mistake as the Python
          # version and the shellcheck version, which is why the check below is
          # against a number instead of prose.
          file "$EFI"

          # 0x000a is IMAGE_SUBSYSTEM_EFI_APPLICATION, the only value that makes
          # firmware load the image as a UEFI application. 0x000b and 0x000c are
          # EFI boot-service and runtime drivers, which boot services will not
          # hand control to. This is the actual property; `file` only describes it.
          SUBSYS=$(objdump -p "$EFI" | awk '/^Subsystem/ {print $2}')
          echo "PE subsystem: $SUBSYS (want 0000000a / EFI application)"
          [ "$SUBSYS" = "0000000a" ] \
            || { echo "::error::$EFI has PE subsystem $SUBSYS, not 0x000a (EFI application)"; exit 1; }

          # .reloc must be present and last: firmware relocates the image into
          # memory and reads the relocation table from the end.
          #
          # `objdump -h` prints a section as TWO lines when its flag list is
          # long: the name line, then a continuation line with the flags. An
          # earlier version of this check used `tail -1`, which returns a flags
          # line and never a section name, so it could not match. It had never
          # run, so nobody found out.
          RELOC_LINE=$(objdump -h "$EFI" | grep -E '^ *[0-9]+ \.' | tail -n 1)
          echo "last PE section: $RELOC_LINE"
          echo "$RELOC_LINE" | grep -q '\.reloc' \
            || { echo "::error::.reloc is not the last PE section"; exit 1; }

          echo "boot bridge: $(stat -c%s "$EFI") bytes, PE32+ EFI application, .reloc last"

      - name: Report kernel size against the .text budget
        run: |
          export PATH="$AF_CROSS_PREFIX/bin:$PATH"

          # build/x86_64/kernel is the CMake target's DIRECTORY. The ELF is
          # kernel.elf — which is what the kernel target sets as its output name.
          # This step used to run size against the directory, and had been
          # failing on it ever since the build-and-boot job first ran; it went
          # unnoticed because an earlier job failed first and skipped this one.
          KERNEL=build/x86_64/kernel.elf

          {
            echo "### Kernel section sizes"
            echo '```'
            x86_64-elf-size -A "$KERNEL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          TEXT_SIZE=$(x86_64-elf-size -A "$KERNEL" | awk '/^\.text/ {print $2}')

          # Read from the one place that defines it, so this job and
          # tools/build.sh cannot disagree. They did: tools/build.sh was raised
          # to 128 KiB by ADR-011 at v0.3 and this number was left at 64 KiB, so
          # even with the path fixed, a correct kernel would have failed here.
          BUDGET=$(bash -c 'source tools/budgets.sh; echo "$AF_TEXT_BUDGET"')

          echo "kernel .text = ${TEXT_SIZE} bytes (budget ${BUDGET})"
          if [ "${TEXT_SIZE:-0}" -gt "${BUDGET}" ]; then
            echo "::error::kernel .text is ${TEXT_SIZE} bytes, over the ${BUDGET} byte budget (ADR-011)"
            exit 1
          fi
          echo "within budget: $((BUDGET - TEXT_SIZE)) bytes spare"

      - name: Package the disk image
        run: |
          python tools/mkimage.py --arch x86_64 \
            --build-dir build/x86_64 \
            --output build/x86_64/afriyieos.img

      - name: Verify the disk image structure
        run: |
          python tools/verify_image.py \
            --image build/x86_64/afriyieos.img \
            --expect "EFI/BOOT/BOOTX64.EFI:build/x86_64/boot/BOOTX64.EFI" \
            --expect "INIT.ELF:build/x86_64/init.elf"

      - name: Boot in QEMU and assert the boot markers
        run: |
          python tools/run_qemu.py --arch x86_64 \
            --image build/x86_64/afriyieos.img \
            --test --timeout 90 \
            --serial-log build/x86_64/boot-serial.log

      - name: Show the boot log
        if: always()
        run: |
          {
            echo "### Boot serial log"
            echo '```'
            cat build/x86_64/boot-serial.log 2>/dev/null || echo "(no serial log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afriyieos-x86_64
          path: |
            build/x86_64/kernel.elf
            build/x86_64/kernel.bin
            build/x86_64/kernel.map
            build/x86_64/init.elf
            build/x86_64/boot/BOOTX64.EFI
            build/x86_64/afriyieos.img
            build/x86_64/boot-serial.log
          if-no-files-found: warn

  # ===========================================================================
  # Lint
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shell script syntax
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

          # The distro package is 0.9.0 on ubuntu-24.04 and a current local
          # install is 0.11.0, and the two number some findings differently:
          # SC2317 versus SC2329 for the same indirect-call false positive, which
          # turned a green local run into a red CI one.
          #
          # The versions are not pinned to match, because the fix for that is a
          # directive covering both codes — tools/verify_all.sh has one, with the
          # reasoning written next to it. What this step adds is the version in
          # the log, so a future divergence is one line away from being obvious
          # instead of a puzzle.
          shellcheck --version | head -n 3
          shellcheck tools/*.sh

      - name: Python syntax
        run: python -m compileall -q tools tests

      - name: No committed build artefacts
        run: |
          if git ls-files | grep -E '\.(o|a|elf|bin|img|iso|efi|pyc)$|__pycache__'; then
            echo "::error::build artefacts are tracked in git"
            exit 1
          fi
          echo "no build artefacts tracked"

      - name: No embedded credentials
        run: |
          # The repository URL carries a PAT for local pushes; it must never be
          # committed. Check for a token pattern in tracked text files.
          if git grep -nI -E 'ghp_[A-Za-z0-9]{36}' -- . ':!*.md' ':!.github/*' ; then
            echo "::error::a GitHub token appears to be committed"
            exit 1
          fi
          echo "no credentials found in tracked files"
